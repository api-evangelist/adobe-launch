generated: '2026-08-13'
method: searched
source: >-
  https://registry.npmjs.org (unauthenticated metadata endpoint, one call per
  package) cross-checked against the Adobe GitHub organization
  (https://github.com/adobe) and the Adobe Experience Platform Tags extension
  development documentation
  (https://experienceleague.adobe.com/en/docs/experience-platform/tags/extension-dev/overview)
provider: Adobe Launch
providerId: adobe-launch
notes: >-
  Adobe publishes every Tags / Reactor client library on npm under the @adobe
  scope from repositories in the github.com/adobe organization, so first-party
  status is unambiguous. There is no first-party Reactor client for Python,
  Java, Ruby, Go, PHP, .NET or Rust — searches of PyPI, Maven Central,
  RubyGems, pkg.go.dev, Packagist, NuGet and crates.io returned no Adobe-owned
  Reactor package. The JavaScript SDK (@adobe/reactor-sdk 2.0.0) is the only
  API client; the remaining @adobe/reactor-* packages are extension-development
  tooling (see cli/adobe-launch-cli.yml) and the client-side runtime that the
  built tag library ships (@adobe/reactor-turbine, @adobe/alloy).
