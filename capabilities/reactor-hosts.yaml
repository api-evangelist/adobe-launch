  - type: http
    namespace: reactor-hosts
    baseUri: https://reactor.adobe.io
    description: Adobe Launch Reactor API — Hosts business capability. Self-contained, no shared references.
    resources:
    - name: hosts-hostId
      path: /hosts/{hostId}
      operations:
      - name: gethost
        method: GET
        description: Retrieve a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updatehost
        method: PATCH
        description: Update a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletehost
        method: DELETE
        description: Delete a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: properties-propertyId-hosts
      path: /properties/{propertyId}/hosts
      operations:
      - name: listhostsforproperty
        method: GET
        description: List Hosts for a Property
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createhost
        method: POST
        description: Create a Host
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_LAUNCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: reactor-hosts-rest
    port: 8080
    description: REST adapter for Adobe Launch Reactor API — Hosts. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/hosts/{hostid}
      name: hosts-hostid
      description: REST surface for hosts-hostId.
      operations:
      - method: GET
        name: gethost
        description: Retrieve a Host
        call: reactor-hosts.gethost
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatehost
        description: Update a Host
        call: reactor-hosts.updatehost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletehost
        description: Delete a Host
        call: reactor-hosts.deletehost
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/properties/{propertyid}/hosts
      name: properties-propertyid-hosts
      description: REST surface for properties-propertyId-hosts.
      operations:
      - method: GET
        name: listhostsforproperty
        description: List Hosts for a Property
        call: reactor-hosts.listhostsforproperty
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createhost
        description: Create a Host
        call: reactor-hosts.createhost
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: reactor-hosts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Launch Reactor API — Hosts. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: retrieve-host
      description: Retrieve a Host
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: reactor-hosts.gethost
      outputParameters:
      - type: object
        mapping: $.
    - name: update-host
      description: Update a Host
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: reactor-hosts.updatehost
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-host
      description: Delete a Host
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: reactor-hosts.deletehost
      outputParameters:
      - type: object
        mapping: $.
    - name: list-hosts-property
      description: List Hosts for a Property
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: reactor-hosts.listhostsforproperty
      outputParameters:
      - type: object
        mapping: $.
    - name: create-host
      description: Create a Host
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: reactor-hosts.createhost
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
