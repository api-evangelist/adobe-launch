naftiko: 1.0.0-alpha2
info:
  label: Adobe Experience Platform Event Forwarding API — Environments
  description: 'Adobe Experience Platform Event Forwarding API — Environments. 1 operations. Lead operation: List Event Forwarding
    Environments. Self-contained Naftiko capability covering one Adobe Launch business surface.'
  tags:
  - Adobe Launch
  - Environments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_LAUNCH_API_KEY: ADOBE_LAUNCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: event-forwarding-environments
    baseUri: https://reactor.adobe.io
    description: Adobe Experience Platform Event Forwarding API — Environments business capability. Self-contained, no shared
      references.
    resources:
    - name: properties-propertyId-environments
      path: /properties/{propertyId}/environments
      operations:
      - name: listeventforwardingenvironments
        method: GET
        description: List Event Forwarding Environments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page[number]
          in: query
          type: integer
        - name: page[size]
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.ADOBE_LAUNCH_API_KEY}}'
  exposes:
  - type: rest
    namespace: event-forwarding-environments-rest
    port: 8080
    description: REST adapter for Adobe Experience Platform Event Forwarding API — Environments. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/properties/{propertyid}/environments
      name: properties-propertyid-environments
      description: REST surface for properties-propertyId-environments.
      operations:
      - method: GET
        name: listeventforwardingenvironments
        description: List Event Forwarding Environments
        call: event-forwarding-environments.listeventforwardingenvironments
        with:
          page[number]: rest.page[number]
          page[size]: rest.page[size]
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: event-forwarding-environments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Experience Platform Event Forwarding API — Environments. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-event-forwarding-environments
      description: List Event Forwarding Environments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: event-forwarding-environments.listeventforwardingenvironments
      with:
        page[number]: tools.page[number]
        page[size]: tools.page[size]
      outputParameters:
      - type: object
        mapping: $.
