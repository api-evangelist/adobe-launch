naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Experience Platform Event Forwarding API"
  description: "Event forwarding allows you to send collected event data to destinations for server-side processing using the Adobe Experience Platform Edge Network."
  tags:
    - Adobe Launch
    - Event Forwarding
    - Edge Network
    - Server Side
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
      ADOBE_API_KEY: ADOBE_API_KEY
      ADOBE_ORG_ID: ADOBE_ORG_ID

capability:
  consumes:
    - type: http
      namespace: event-forwarding
      baseUri: https://reactor.adobe.io
      description: "Adobe Experience Platform Event Forwarding API"
      authentication:
        type: bearer
        token: "{{ADOBE_ACCESS_TOKEN}}"
      resources:
        - name: properties
          path: /companies/{companyId}/properties
          description: "Event forwarding property management (edge platform)"
          operations:
            - name: list-properties
              method: GET
              description: "List event forwarding properties (platform=edge)"
              inputParameters:
                - name: companyId
                  in: path
                  type: string
                  required: true
                  description: "Company ID"
                - name: filter[platform]
                  in: query
                  type: string
                  required: true
                  description: "Filter to edge platform"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-property
              method: POST
              description: "Create an event forwarding property"
              inputParameters:
                - name: companyId
                  in: path
                  type: string
                  required: true
                  description: "Company ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: rules
          path: /properties/{propertyId}/rules
          description: "Event forwarding rule management"
          operations:
            - name: list-rules
              method: GET
              description: "List event forwarding rules"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-rule
              method: POST
              description: "Create an event forwarding rule"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: secrets
          path: /properties/{propertyId}/secrets
          description: "Secret management for event forwarding"
          operations:
            - name: list-secrets
              method: GET
              description: "List secrets for a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-secret
              method: POST
              description: "Create a new secret"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"

  exposes:
    - type: rest
      port: 8102
      namespace: event-forwarding-api
      resources:
        - path: /v1/event-forwarding-properties
          name: properties
          description: "Event forwarding properties"
          operations:
            - method: GET
              name: list-properties
              description: "List event forwarding properties"

    - type: mcp
      port: 9102
      namespace: event-forwarding-mcp
      transport: http
      tools:
        - name: list-properties
          description: "List event forwarding properties"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-properties"
          with:
            companyId: "tools.companyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-rules
          description: "List event forwarding rules"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-rules"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-secrets
          description: "List secrets for an event forwarding property"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-secrets"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
