naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Launch Extension API"
  description: "API for developing and managing custom extensions for Adobe Experience Platform Tags. Extensions are the building blocks of tags and consist of library modules and views."
  tags:
    - Adobe Launch
    - Extensions
    - Development
    - Tag Management
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
      ADOBE_API_KEY: ADOBE_API_KEY
      ADOBE_ORG_ID: ADOBE_ORG_ID

capability:
  consumes:
    - type: http
      namespace: extension
      baseUri: https://reactor.adobe.io
      description: "Adobe Launch Extension API"
      authentication:
        type: bearer
        token: "{{ADOBE_ACCESS_TOKEN}}"
      resources:
        - name: extension-packages
          path: /extension_packages
          description: "Extension package management"
          operations:
            - name: list-extension-packages
              method: GET
              description: "List all extension packages"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-extension-package
              method: POST
              description: "Create an extension package"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: get-extension-package
              method: GET
              description: "Retrieve a specific extension package"
              inputParameters:
                - name: extensionPackageId
                  in: path
                  type: string
                  required: true
                  description: "Extension package ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-extension-package
              method: PATCH
              description: "Update an extension package"
              inputParameters:
                - name: extensionPackageId
                  in: path
                  type: string
                  required: true
                  description: "Extension package ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: extensions
          path: /properties/{propertyId}/extensions
          description: "Extension installation management"
          operations:
            - name: list-extensions
              method: GET
              description: "List extensions installed on a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: install-extension
              method: POST
              description: "Install an extension on a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: get-extension
              method: GET
              description: "Retrieve a specific extension"
              inputParameters:
                - name: extensionId
                  in: path
                  type: string
                  required: true
                  description: "Extension ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-extension
              method: DELETE
              description: "Delete an extension from a property"
              inputParameters:
                - name: extensionId
                  in: path
                  type: string
                  required: true
                  description: "Extension ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: extension-api
      resources:
        - path: /v1/extension-packages
          name: extension-packages
          description: "Extension package management"
          operations:
            - method: GET
              name: list-extension-packages
              description: "List extension packages"

    - type: mcp
      port: 9101
      namespace: extension-mcp
      transport: http
      tools:
        - name: list-extension-packages
          description: "List all extension packages"
          hints:
            readOnly: true
            openWorld: true
          call: "extension.list-extension-packages"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-extension-package
          description: "Get a specific extension package"
          hints:
            readOnly: true
            openWorld: true
          call: "extension.get-extension-package"
          with:
            extensionPackageId: "tools.extensionPackageId"
          outputParameters:
            - type: object
              mapping: "$."
