naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Launch Reactor API"
  description: "The Reactor API allows you to programmatically manage all resources for Adobe Experience Platform Tags, including properties, data elements, rules, extensions, library builds, and environments."
  tags:
    - Adobe Launch
    - Tag Management
    - Marketing Technology
    - Data Collection
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
      ADOBE_API_KEY: ADOBE_API_KEY
      ADOBE_ORG_ID: ADOBE_ORG_ID

capability:
  consumes:
    - type: http
      namespace: reactor
      baseUri: https://reactor.adobe.io
      description: "Adobe Launch Reactor API"
      authentication:
        type: bearer
        token: "{{ADOBE_ACCESS_TOKEN}}"
      resources:
        - name: companies
          path: /companies
          description: "Company management"
          operations:
            - name: list-companies
              method: GET
              description: "Retrieve all companies you have access to"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-company
              method: GET
              description: "Retrieve a specific company"
              inputParameters:
                - name: companyId
                  in: path
                  type: string
                  required: true
                  description: "Company ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: properties
          path: /companies/{companyId}/properties
          description: "Tag property management"
          operations:
            - name: list-properties
              method: GET
              description: "List properties for a company"
              inputParameters:
                - name: companyId
                  in: path
                  type: string
                  required: true
                  description: "Company ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-property
              method: POST
              description: "Create a new property"
              inputParameters:
                - name: companyId
                  in: path
                  type: string
                  required: true
                  description: "Company ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: get-property
              method: GET
              description: "Retrieve a specific property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-property
              method: PATCH
              description: "Update a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: delete-property
              method: DELETE
              description: "Delete a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: rules
          path: /properties/{propertyId}/rules
          description: "Rule management"
          operations:
            - name: list-rules
              method: GET
              description: "List rules for a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-rule
              method: POST
              description: "Create a new rule"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
            - name: get-rule
              method: GET
              description: "Retrieve a specific rule"
              inputParameters:
                - name: ruleId
                  in: path
                  type: string
                  required: true
                  description: "Rule ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-rule
              method: DELETE
              description: "Delete a rule"
              inputParameters:
                - name: ruleId
                  in: path
                  type: string
                  required: true
                  description: "Rule ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: data-elements
          path: /properties/{propertyId}/data_elements
          description: "Data element management"
          operations:
            - name: list-data-elements
              method: GET
              description: "List data elements for a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-data-element
              method: POST
              description: "Create a new data element"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: extensions
          path: /properties/{propertyId}/extensions
          description: "Extension management"
          operations:
            - name: list-extensions
              method: GET
              description: "List extensions installed on a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-extension
              method: POST
              description: "Install an extension on a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: libraries
          path: /properties/{propertyId}/libraries
          description: "Library and build management"
          operations:
            - name: list-libraries
              method: GET
              description: "List libraries for a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-library
              method: POST
              description: "Create a new library"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: environments
          path: /properties/{propertyId}/environments
          description: "Environment management"
          operations:
            - name: list-environments
              method: GET
              description: "List environments for a property"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-environment
              method: POST
              description: "Create a new environment"
              inputParameters:
                - name: propertyId
                  in: path
                  type: string
                  required: true
                  description: "Property ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"
        - name: builds
          path: /libraries/{libraryId}/builds
          description: "Build management"
          operations:
            - name: create-build
              method: POST
              description: "Create a new build from a library"
              inputParameters:
                - name: libraryId
                  in: path
                  type: string
                  required: true
                  description: "Library ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: search
          path: /search
          description: "Search across resources"
          operations:
            - name: search
              method: POST
              description: "Search across all resources"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  data: "{{tools.data}}"

  exposes:
    - type: rest
      port: 8100
      namespace: reactor-api
      resources:
        - path: /v1/companies
          name: companies
          description: "Company management"
          operations:
            - method: GET
              name: list-companies
              description: "List companies"
        - path: /v1/properties
          name: properties
          description: "Property management"
          operations:
            - method: GET
              name: list-properties
              description: "List properties"
        - path: /v1/rules
          name: rules
          description: "Rule management"
          operations:
            - method: GET
              name: list-rules
              description: "List rules"

    - type: mcp
      port: 9100
      namespace: reactor-mcp
      transport: http
      tools:
        - name: list-companies
          description: "List all companies"
          hints:
            readOnly: true
            openWorld: true
          call: "reactor.list-companies"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-properties
          description: "List properties for a company"
          hints:
            readOnly: true
            openWorld: true
          call: "reactor.list-properties"
          with:
            companyId: "tools.companyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-rules
          description: "List rules for a property"
          hints:
            readOnly: true
            openWorld: true
          call: "reactor.list-rules"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search
          description: "Search across all resources"
          hints:
            readOnly: true
            openWorld: true
          call: "reactor.search"
          outputParameters:
            - type: object
              mapping: "$."
