naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Experience Platform Data Collection API"
  description: "Data Collection APIs for sending data directly to the Adobe Experience Platform Edge Network, including the Edge Network API and Media Edge API."
  tags:
    - Adobe Launch
    - Data Collection
    - Edge Network
    - Analytics
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
      ADOBE_API_KEY: ADOBE_API_KEY

capability:
  consumes:
    - type: http
      namespace: data-collection
      baseUri: https://edge.adobedc.net
      description: "Adobe Experience Platform Data Collection API"
      authentication:
        type: bearer
        token: "{{ADOBE_ACCESS_TOKEN}}"
      resources:
        - name: edge-network
          path: /ee/v2
          description: "Edge Network interactive and batch data collection"
          operations:
            - name: interact
              method: POST
              description: "Send an interactive event with real-time response"
              inputParameters:
                - name: datastreamId
                  in: query
                  type: string
                  required: true
                  description: "Datastream configuration ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  event: "{{tools.event}}"
            - name: collect
              method: POST
              description: "Send batch events without expecting a response"
              inputParameters:
                - name: datastreamId
                  in: query
                  type: string
                  required: true
                  description: "Datastream configuration ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  events: "{{tools.events}}"
        - name: media
          path: /ee/va/v1
          description: "Media Edge API for tracking media playback"
          operations:
            - name: media-session-start
              method: POST
              description: "Start a media tracking session"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  events: "{{tools.events}}"
            - name: media-play
              method: POST
              description: "Track media play event"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  events: "{{tools.events}}"
            - name: media-session-complete
              method: POST
              description: "Track media session complete"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  events: "{{tools.events}}"
            - name: media-session-end
              method: POST
              description: "End a media tracking session"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  events: "{{tools.events}}"

  exposes:
    - type: rest
      port: 8103
      namespace: data-collection-api
      resources:
        - path: /v1/events
          name: events
          description: "Edge Network event collection"
          operations:
            - method: POST
              name: interact
              description: "Send interactive event"
            - method: POST
              name: collect
              description: "Send batch events"

    - type: mcp
      port: 9103
      namespace: data-collection-mcp
      transport: http
      tools:
        - name: send-interactive-event
          description: "Send an interactive event to Edge Network"
          hints:
            readOnly: false
          call: "data-collection.interact"
          with:
            datastreamId: "tools.datastreamId"
            event: "tools.event"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-batch-events
          description: "Send batch events to Edge Network"
          hints:
            readOnly: false
          call: "data-collection.collect"
          with:
            datastreamId: "tools.datastreamId"
            events: "tools.events"
          outputParameters:
            - type: object
              mapping: "$."
