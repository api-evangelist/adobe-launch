naftiko: "1.0.0-alpha1"

info:
  label: "Adobe Launch Data Collection Pipeline"
  description: "Unified workflow for Adobe Experience Platform data collection. Combines Event Forwarding and Data Collection APIs for data engineers managing server-side event routing, Edge Network data ingestion, and media analytics tracking."
  tags:
    - Adobe Launch
    - Data Collection
    - Event Forwarding
    - Edge Network
  created: "2026-04-18"
  modified: "2026-04-18"

binds:
  - namespace: env
    keys:
      ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
      ADOBE_API_KEY: ADOBE_API_KEY
      ADOBE_ORG_ID: ADOBE_ORG_ID

capability:
  consumes:
    - import: event-forwarding
      location: ./shared/event-forwarding.yaml
    - import: data-collection
      location: ./shared/data-collection.yaml

  exposes:
    - type: rest
      port: 8081
      namespace: data-collection-pipeline-api
      description: "Unified REST API for Adobe data collection pipeline management."
      resources:
        - path: /v1/event-forwarding-properties
          name: event-forwarding-properties
          description: "Server-side event forwarding properties"
          operations:
            - method: GET
              name: list-event-forwarding-properties
              description: "List event forwarding properties"
              call: "event-forwarding.list-properties"
              with:
                companyId: "rest.companyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/event-forwarding-rules
          name: event-forwarding-rules
          description: "Event forwarding rules"
          operations:
            - method: GET
              name: list-event-forwarding-rules
              description: "List event forwarding rules"
              call: "event-forwarding.list-rules"
              with:
                propertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/secrets
          name: secrets
          description: "Secrets for event forwarding destinations"
          operations:
            - method: GET
              name: list-secrets
              description: "List secrets for a property"
              call: "event-forwarding.list-secrets"
              with:
                propertyId: "rest.propertyId"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/events
          name: events
          description: "Edge Network data ingestion"
          operations:
            - method: POST
              name: send-interactive-event
              description: "Send an interactive event to Edge Network"
              call: "data-collection.interact"
              with:
                datastreamId: "rest.datastreamId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: send-batch-events
              description: "Send batch events to Edge Network"
              call: "data-collection.collect"
              with:
                datastreamId: "rest.datastreamId"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9091
      namespace: data-collection-pipeline-mcp
      transport: http
      description: "MCP server for AI-assisted Adobe data collection pipeline management."
      tools:
        - name: list-event-forwarding-properties
          description: "List server-side event forwarding properties"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-properties"
          with:
            companyId: "tools.companyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-event-forwarding-property
          description: "Create a new event forwarding property"
          hints:
            readOnly: false
          call: "event-forwarding.create-property"
          with:
            companyId: "tools.companyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-event-forwarding-rules
          description: "List event forwarding rules for a property"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-rules"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-event-forwarding-rule
          description: "Create a new event forwarding rule"
          hints:
            readOnly: false
          call: "event-forwarding.create-rule"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-secrets
          description: "List secrets for authenticating with forwarding destinations"
          hints:
            readOnly: true
            openWorld: true
          call: "event-forwarding.list-secrets"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-secret
          description: "Create a secret for an event forwarding destination"
          hints:
            readOnly: false
          call: "event-forwarding.create-secret"
          with:
            propertyId: "tools.propertyId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-interactive-event
          description: "Send an interactive event to Adobe Edge Network"
          hints:
            readOnly: false
          call: "data-collection.interact"
          with:
            datastreamId: "tools.datastreamId"
            event: "tools.event"
          outputParameters:
            - type: object
              mapping: "$."
        - name: send-batch-events
          description: "Send batch events to Adobe Edge Network"
          hints:
            readOnly: false
          call: "data-collection.collect"
          with:
            datastreamId: "tools.datastreamId"
            events: "tools.events"
          outputParameters:
            - type: object
              mapping: "$."
        - name: start-media-session
          description: "Start a media tracking session"
          hints:
            readOnly: false
          call: "data-collection.media-session-start"
          outputParameters:
            - type: object
              mapping: "$."
        - name: end-media-session
          description: "End a media tracking session"
          hints:
            readOnly: false
          call: "data-collection.media-session-end"
          outputParameters:
            - type: object
              mapping: "$."
