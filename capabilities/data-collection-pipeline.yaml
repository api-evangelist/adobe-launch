naftiko: 1.0.0-alpha2
info:
  label: Adobe Launch Data Collection Pipeline
  description: Unified workflow for Adobe Experience Platform data collection. Combines Event Forwarding and Data Collection
    APIs for data engineers managing server-side event routing, Edge Network data ingestion, and media analytics tracking.
  tags:
  - Adobe Launch
  - Data Collection
  - Event Forwarding
  - Edge Network
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ADOBE_ACCESS_TOKEN: ADOBE_ACCESS_TOKEN
    ADOBE_API_KEY: ADOBE_API_KEY
    ADOBE_ORG_ID: ADOBE_ORG_ID
capability:
  consumes:
  - type: http
    namespace: event-forwarding
    baseUri: https://reactor.adobe.io
    description: Adobe Experience Platform Event Forwarding API
    authentication:
      type: bearer
      token: '{{ADOBE_ACCESS_TOKEN}}'
    resources:
    - name: properties
      path: /companies/{companyId}/properties
      description: Event forwarding property management (edge platform)
      operations:
      - name: list-properties
        method: GET
        description: List event forwarding properties (platform=edge)
        inputParameters:
        - name: companyId
          in: path
          type: string
          required: true
          description: Company ID
        - name: filter[platform]
          in: query
          type: string
          required: true
          description: Filter to edge platform
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-property
        method: POST
        description: Create an event forwarding property
        inputParameters:
        - name: companyId
          in: path
          type: string
          required: true
          description: Company ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            data: '{{tools.data}}'
    - name: rules
      path: /properties/{propertyId}/rules
      description: Event forwarding rule management
      operations:
      - name: list-rules
        method: GET
        description: List event forwarding rules
        inputParameters:
        - name: propertyId
          in: path
          type: string
          required: true
          description: Property ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-rule
        method: POST
        description: Create an event forwarding rule
        inputParameters:
        - name: propertyId
          in: path
          type: string
          required: true
          description: Property ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            data: '{{tools.data}}'
    - name: secrets
      path: /properties/{propertyId}/secrets
      description: Secret management for event forwarding
      operations:
      - name: list-secrets
        method: GET
        description: List secrets for a property
        inputParameters:
        - name: propertyId
          in: path
          type: string
          required: true
          description: Property ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-secret
        method: POST
        description: Create a new secret
        inputParameters:
        - name: propertyId
          in: path
          type: string
          required: true
          description: Property ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            data: '{{tools.data}}'
  - type: http
    namespace: data-collection
    baseUri: https://edge.adobedc.net
    description: Adobe Experience Platform Data Collection API
    authentication:
      type: bearer
      token: '{{ADOBE_ACCESS_TOKEN}}'
    resources:
    - name: edge-network
      path: /ee/v2
      description: Edge Network interactive and batch data collection
      operations:
      - name: interact
        method: POST
        description: Send an interactive event with real-time response
        inputParameters:
        - name: datastreamId
          in: query
          type: string
          required: true
          description: Datastream configuration ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            event: '{{tools.event}}'
      - name: collect
        method: POST
        description: Send batch events without expecting a response
        inputParameters:
        - name: datastreamId
          in: query
          type: string
          required: true
          description: Datastream configuration ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            events: '{{tools.events}}'
    - name: media
      path: /ee/va/v1
      description: Media Edge API for tracking media playback
      operations:
      - name: media-session-start
        method: POST
        description: Start a media tracking session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            events: '{{tools.events}}'
      - name: media-play
        method: POST
        description: Track media play event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            events: '{{tools.events}}'
      - name: media-session-complete
        method: POST
        description: Track media session complete
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            events: '{{tools.events}}'
      - name: media-session-end
        method: POST
        description: End a media tracking session
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            events: '{{tools.events}}'
  exposes:
  - type: rest
    port: 8081
    namespace: data-collection-pipeline-api
    description: Unified REST API for Adobe data collection pipeline management.
    resources:
    - path: /v1/event-forwarding-properties
      name: event-forwarding-properties
      description: Server-side event forwarding properties
      operations:
      - method: GET
        name: list-event-forwarding-properties
        description: List event forwarding properties
        call: event-forwarding.list-properties
        with:
          companyId: rest.companyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/event-forwarding-rules
      name: event-forwarding-rules
      description: Event forwarding rules
      operations:
      - method: GET
        name: list-event-forwarding-rules
        description: List event forwarding rules
        call: event-forwarding.list-rules
        with:
          propertyId: rest.propertyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/secrets
      name: secrets
      description: Secrets for event forwarding destinations
      operations:
      - method: GET
        name: list-secrets
        description: List secrets for a property
        call: event-forwarding.list-secrets
        with:
          propertyId: rest.propertyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/events
      name: events
      description: Edge Network data ingestion
      operations:
      - method: POST
        name: send-interactive-event
        description: Send an interactive event to Edge Network
        call: data-collection.interact
        with:
          datastreamId: rest.datastreamId
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: send-batch-events
        description: Send batch events to Edge Network
        call: data-collection.collect
        with:
          datastreamId: rest.datastreamId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9091
    namespace: data-collection-pipeline-mcp
    transport: http
    description: MCP server for AI-assisted Adobe data collection pipeline management.
    tools:
    - name: list-event-forwarding-properties
      description: List server-side event forwarding properties
      hints:
        readOnly: true
        openWorld: true
      call: event-forwarding.list-properties
      with:
        companyId: tools.companyId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-event-forwarding-property
      description: Create a new event forwarding property
      hints:
        readOnly: false
      call: event-forwarding.create-property
      with:
        companyId: tools.companyId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-event-forwarding-rules
      description: List event forwarding rules for a property
      hints:
        readOnly: true
        openWorld: true
      call: event-forwarding.list-rules
      with:
        propertyId: tools.propertyId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-event-forwarding-rule
      description: Create a new event forwarding rule
      hints:
        readOnly: false
      call: event-forwarding.create-rule
      with:
        propertyId: tools.propertyId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-secrets
      description: List secrets for authenticating with forwarding destinations
      hints:
        readOnly: true
        openWorld: true
      call: event-forwarding.list-secrets
      with:
        propertyId: tools.propertyId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-secret
      description: Create a secret for an event forwarding destination
      hints:
        readOnly: false
      call: event-forwarding.create-secret
      with:
        propertyId: tools.propertyId
      outputParameters:
      - type: object
        mapping: $.
    - name: send-interactive-event
      description: Send an interactive event to Adobe Edge Network
      hints:
        readOnly: false
      call: data-collection.interact
      with:
        datastreamId: tools.datastreamId
        event: tools.event
      outputParameters:
      - type: object
        mapping: $.
    - name: send-batch-events
      description: Send batch events to Adobe Edge Network
      hints:
        readOnly: false
      call: data-collection.collect
      with:
        datastreamId: tools.datastreamId
        events: tools.events
      outputParameters:
      - type: object
        mapping: $.
    - name: start-media-session
      description: Start a media tracking session
      hints:
        readOnly: false
      call: data-collection.media-session-start
      outputParameters:
      - type: object
        mapping: $.
    - name: end-media-session
      description: End a media tracking session
      hints:
        readOnly: false
      call: data-collection.media-session-end
      outputParameters:
      - type: object
        mapping: $.
