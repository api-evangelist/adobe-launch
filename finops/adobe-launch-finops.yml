  - Experience Platform
notes: >-
  Adobe Launch / Experience Platform Tags is bundled with every Experience
  Cloud product license at no incremental cost. There is no separate
  invoice line; FinOps levers focus on operational hygiene (property
  cleanup, library size) rather than cost optimization.
description: >-
  FOCUS-aligned FinOps shape for Adobe Launch / Experience Platform Tags:
  bundled with Experience Cloud product licenses; no incremental billing.
sources:
  - https://experienceleague.adobe.com/docs/experience-platform/tags/home.html
  - https://developer.adobe.com/experience-platform-apis/references/reactor/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Adobe Inc.
serviceCategory: Tag Management
billingModel:
  pricingCategory: Bundled (No Incremental Charge)
  billingFrequency: Bundled
  billingCurrency: USD
  chargeCategories:
    - Adjustment
focusColumns:
  ServiceName: Adobe Experience Platform Tags
  ServiceCategory: Tag Management
  ProviderName: Adobe
  PublisherName: Adobe Inc.
  InvoiceIssuerName: Adobe Inc.
  BillingCurrency: USD
  ChargeCategory: Adjustment
meters:
  - name: tag_properties
    description: Tag-management properties under management (operational, not billed)
    unit: property
    aggregation: max
    dimensions:
      - environment
  - name: tag_rules
    description: Active tag-management rules (operational, not billed)
    unit: rule
    aggregation: max
    dimensions:
      - property
  - name: library_size
    description: Published tag-library payload size delivered to visitors
    unit: KB
    aggregation: avg
    dimensions:
      - property
      - environment
principles:
  - name: Visibility
    description: >-
      Use the Tags UI and Reactor API to inventory all properties,
      libraries, and rules; track library payload size to monitor
      visitor-side performance impact.
  - name: Allocation
    description: >-
      Group properties by brand / business unit; restrict Reactor API
      credentials per team to attribute tag-management ownership.
  - name: Optimization
    description: >-
      Reduce library payload size by removing unused extensions, rules,
      and data elements; consolidate redundant analytics tags; use Edge
      tags where possible to reduce client-side load.
  - name: Accountability
    description: >-
      Marketing analytics or web platform team owns property hygiene and
      change control; deprecation reviews quarterly.
maintainers:
