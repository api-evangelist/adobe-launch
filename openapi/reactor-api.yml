                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          type:
                            type: string
                            enum: [rules]

    LibraryUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
          properties:
            id:
              type: string
            type:
              type: string
              enum: [libraries]
            attributes:
              type: object
              properties:
                name:
                  type: string
            meta:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - submit
                    - approve
                    - reject
                    - develop
                  description: The publishing state transition action.

    # Build
    BuildAttributes:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
          description: The current status of the build.
        token:
          type: string
          description: A unique token for the build.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BuildResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [builds]
        attributes:
          $ref: '#/components/schemas/BuildAttributes'
        relationships:
          type: object
          properties:
            library:
              $ref: '#/components/schemas/Relationship'
            environment:
              $ref: '#/components/schemas/Relationship'
            data_elements:
              $ref: '#/components/schemas/Relationship'
            extensions:
              $ref: '#/components/schemas/Relationship'
            rules:
              $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

    BuildListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BuildResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    BuildSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/BuildResource'

    # Environment
    EnvironmentAttributes:
      type: object
      properties:
        name:
          type: string
          description: The name of the environment.
        stage:
          type: string
          enum:
            - development
            - staging
            - production
          description: The environment stage.
        archive:
          type: boolean
          description: Whether the build is delivered as a ZIP archive.
        path:
          type: string
          description: The URL path appended to the host domain for deployment.
        library_name:
          type: string
          description: The custom library filename.
        library_path:
          type: string
          description: The custom library path.
        token:
          type: string
          description: A unique token for the environment.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvironmentResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [environments]
        attributes:
          $ref: '#/components/schemas/EnvironmentAttributes'
        relationships:
          type: object
          properties:
            property:
              $ref: '#/components/schemas/Relationship'
            host:
              $ref: '#/components/schemas/Relationship'
            library:
              $ref: '#/components/schemas/Relationship'
            builds:
              $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

    EnvironmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnvironmentResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    EnvironmentSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnvironmentResource'

    EnvironmentCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
            - relationships
          properties:
            type:
              type: string
              enum: [environments]
            attributes:
              type: object
              required:
                - name
                - stage
              properties:
                name:
                  type: string
                stage:
                  type: string
                  enum:
                    - development
                    - staging
                    - production
                archive:
                  type: boolean
                path:
                  type: string
            relationships:
              type: object
              required:
                - host
              properties:
                host:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [hosts]

    EnvironmentUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
            type:
              type: string
              enum: [environments]
            attributes:
              type: object
              properties:
                name:
                  type: string
                archive:
                  type: boolean
                path:
                  type: string

    # Host
    HostAttributes:
      type: object
      properties:
        name:
          type: string
          description: The human-readable name of the host.
        type_of:
          type: string
          enum:
            - akamai
            - sftp
          description: The hosting type.
        server:
          type: string
          description: The host URL for SFTP hosts.
        port:
          type: integer
          description: The server port for SFTP hosts.
        path:
          type: string
          description: The URL path suffix for SFTP hosts.
        username:
          type: string
          description: The authentication username for SFTP hosts.
        encrypted_private_key:
          type: string
          description: The encrypted private key for SFTP hosts.
        skip_symlinks:
          type: boolean
          description: Whether to use file copying instead of symbolic links for SFTP hosts.
        status:
          type: string
          description: The current status of the host.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HostResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [hosts]
        attributes:
          $ref: '#/components/schemas/HostAttributes'
        relationships:
          type: object
          properties:
            property:
              $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

    HostListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/HostResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    HostSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/HostResource'

    HostCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum: [hosts]
            attributes:
              type: object
              required:
                - name
                - type_of
              properties:
                name:
                  type: string
                type_of:
                  type: string
                  enum:
                    - akamai
                    - sftp
                server:
                  type: string
                port:
                  type: integer
                path:
                  type: string
                username:
                  type: string
                encrypted_private_key:
                  type: string
                skip_symlinks:
                  type: boolean

    HostUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
            type:
              type: string
              enum: [hosts]
            attributes:
              type: object
              properties:
                name:
                  type: string
                server:
                  type: string
                port:
                  type: integer
                path:
                  type: string
                username:
                  type: string
                encrypted_private_key:
                  type: string
                skip_symlinks:
                  type: boolean

    # Callback
    CallbackAttributes:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The HTTPS URL to send callback messages to.
        subscriptions:
          type: array
          items:
            type: string
          description: The audit event types that trigger the callback.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CallbackResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [callbacks]
        attributes:
          $ref: '#/components/schemas/CallbackAttributes'
        relationships:
          type: object
          properties:
            property:
              $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

    CallbackListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CallbackResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CallbackSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CallbackResource'

    CallbackCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
          properties:
            type:
              type: string
              enum: [callbacks]
            attributes:
              type: object
              required:
                - url
                - subscriptions
              properties:
                url:
                  type: string
                  format: uri
                subscriptions:
                  type: array
                  items:
                    type: string

    CallbackUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
            type:
              type: string
              enum: [callbacks]
            attributes:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                subscriptions:
                  type: array
                  items:
                    type: string

    # Secret
    SecretAttributes:
      type: object
      properties:
        name:
          type: string
          description: The name of the secret.
        type_of:
          type: string
          enum:
            - token
            - simple-http
            - oauth2
            - oauth2-google
          description: The type of secret.
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
          description: The exchange status of the secret.
        credentials:
          type: object
          description: The credential payload, varies by secret type.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecretResource:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [secrets]
        attributes:
          $ref: '#/components/schemas/SecretAttributes'
        relationships:
          type: object
          properties:
            property:
              $ref: '#/components/schemas/Relationship'
            environment:
              $ref: '#/components/schemas/Relationship'
        links:
          type: object
          properties:
            self:
              type: string
              format: uri

    SecretListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SecretResource'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SecretSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SecretResource'

    SecretCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - type
            - attributes
            - relationships
          properties:
            type:
              type: string
              enum: [secrets]
            attributes:
              type: object
              required:
                - name
                - type_of
              properties:
                name:
                  type: string
                type_of:
                  type: string
                  enum:
                    - token
                    - simple-http
                    - oauth2
                    - oauth2-google
                credentials:
                  type: object
            relationships:
              type: object
              required:
                - environment
              properties:
                environment:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [environments]

    SecretUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
          properties:
            id:
              type: string
            type:
              type: string
              enum: [secrets]
            meta:
              type: object
              properties:
                action:
                  type: string
                  enum:
                    - test
                    - retry
                    - reauthorize

    # Search
    SearchRequest:
      type: object
      properties:
        data:
          type: object
          properties:
            from:
              type: integer
              description: Number of results to offset by.
            size:
              type: integer
              description: Maximum number of results to return (max 100).
              maximum: 100
            query:
              type: object
              description: Search query with field paths and matching conditions.
              properties:
                attributes.name:
                  type: object
                  properties:
                    value:
                      type: string
                attributes.created_at:
                  type: object
                  properties:
                    range:
                      type: object
                      properties:
                        gt:
                          type: string
                        gte:
                          type: string
                        lt:
                          type: string
                        lte:
                          type: string
            sort:
              type: array
              items:
                type: object
                properties:
                  attributes.created_at:
                    type: string
                    enum:
                      - asc
                      - desc
                  attributes.name:
                    type: string
                    enum:
                      - asc
                      - desc
            resource_types:
              type: array
              items:
                type: string
                enum:
                  - audit_events
                  - builds
                  - callbacks
                  - data_elements
                  - environments
                  - extension_packages
                  - extensions
                  - hosts
                  - libraries
                  - properties
                  - rule_components
                  - rules

    SearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              attributes:
                type: object
              relationships:
                type: object
              links:
                type: object
        meta:
          type: object
          properties:
            total_hits:
              type: integer

tags:
  - name: Companies
    description: Manage organization companies.
  - name: Properties
    description: Manage tag properties which serve as containers for rules, data elements, extensions, and libraries.
  - name: Rules
    description: Manage rules that control tag behavior through events, conditions, and actions.
  - name: Rule Components
    description: Manage the individual event, condition, and action components within rules.
  - name: Data Elements
    description: Manage data elements that serve as variables pointing to application data.
  - name: Extensions
    description: Manage installed extensions within properties.
  - name: Extension Packages
    description: Manage extension packages that define capabilities available to tags users.
  - name: Libraries
    description: Manage libraries which are collections of resources compiled into builds.
  - name: Builds
    description: Manage compiled tag library builds for deployment.
  - name: Environments
    description: Manage deployment environments for tag library builds.
  - name: Hosts
    description: Manage hosting destinations for tag library delivery.
  - name: Callbacks
    description: Manage webhook callbacks triggered by audit events.
  - name: Secrets
    description: Manage secrets for event forwarding properties to authenticate with external systems.
  - name: Search
    description: Search across multiple resource types.
