        type: string
        enum:
        - data_elements
        - extensions
        - rules
      description: The type of resource to manage in the library relationship.
    filterCreatedAt:
      name: filter[created_at]
      in: query
      schema:
        type: string
      description: Filter by creation date.
    filterUpdatedAt:
      name: filter[updated_at]
      in: query
      schema:
        type: string
      description: Filter by last updated date.
    filterName:
      name: filter[name]
      in: query
      schema:
        type: string
      description: Filter by name.
    filterEnabled:
      name: filter[enabled]
      in: query
      schema:
        type: boolean
      description: Filter by enabled status.
    filterPublished:
      name: filter[published]
      in: query
      schema:
        type: boolean
      description: Filter by published status.
    filterDirty:
      name: filter[dirty]
      in: query
      schema:
        type: boolean
      description: Filter by dirty (unpublished changes) status.
    filterPlatform:
      name: filter[platform]
      in: query
      schema:
        type: string
        enum:
        - web
        - mobile
        - edge
      description: Filter by platform type.
    pageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
      description: Page number for pagination.
    pageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Number of results per page.

  responses:
    NotFound:
      description: The requested resource was not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
