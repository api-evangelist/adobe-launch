openapi: 3.1.0
info:
  title: Adobe Launch Reactor API
  description: >-
    The Reactor API allows you to programmatically manage all resources for
    Adobe Experience Platform Tags, including properties, data elements, rules,
    extensions, library builds, and environments. It follows the JSON:API
    specification for request and response formatting.
  version: 1.0.0
  contact:
    name: Adobe Developer Support
    url: https://experienceleague.adobe.com/?support-solution=Experience+Platform
  license:
    name: Adobe Terms of Service
    url: https://www.adobe.com/legal/terms.html
  termsOfService: https://www.adobe.com/legal/terms.html

servers:
  - url: https://reactor.adobe.io
    description: Adobe Reactor API Production Server

security:
  - bearerAuth: []
    apiKey: []
    orgId: []

paths:
  # Companies
  /companies:
    get:
      operationId: listCompanies
      summary: List companies
      description: Retrieve all companies you have access to.
      tags:
        - Companies
      parameters:
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of companies.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanyListResponse'

  /companies/{companyId}:
    get:
      operationId: getCompany
      summary: Retrieve a company
      description: Look up details for a specific company by its ID.
      tags:
        - Companies
      parameters:
        - $ref: '#/components/parameters/companyId'
      responses:
        '200':
          description: Company details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanySingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # Properties
  /companies/{companyId}/properties:
    get:
      operationId: listPropertiesForCompany
      summary: List properties for a company
      description: Retrieve a list of properties belonging to a company.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/companyId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterEnabled'
        - $ref: '#/components/parameters/filterPlatform'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of properties.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
    post:
      operationId: createProperty
      summary: Create a property
      description: Create a new property under the specified company.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/companyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
      responses:
        '201':
          description: Property created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertySingleResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /properties/{propertyId}:
    get:
      operationId: getProperty
      summary: Retrieve a property
      description: Look up details for a specific property by its ID.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: Property details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertySingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProperty
      summary: Update a property
      description: Update the editable attributes of a property.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/PropertyUpdateRequest'
      responses:
        '200':
          description: Property updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertySingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteProperty
      summary: Delete a property
      description: Remove a property. Returns HTTP 204 on success.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '204':
          description: Property deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /properties/{propertyId}/company:
    get:
      operationId: getCompanyForProperty
      summary: Get the company for a property
      description: Retrieve the company that owns the specified property.
      tags:
        - Properties
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: Company details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CompanySingleResponse'

  # Rules
  /properties/{propertyId}/rules:
    get:
      operationId: listRulesForProperty
      summary: List rules for a property
      description: Retrieve all rules belonging to a property.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/propertyId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterEnabled'
        - $ref: '#/components/parameters/filterPublished'
        - $ref: '#/components/parameters/filterDirty'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of rules.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleListResponse'
    post:
      operationId: createRule
      summary: Create a rule
      description: Create a new rule under the specified property.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RuleCreateRequest'
      responses:
        '201':
          description: Rule created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleSingleResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /rules/{ruleId}:
    get:
      operationId: getRule
      summary: Retrieve a rule
      description: Look up a specific rule by its ID.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Rule details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRule
      summary: Update a rule
      description: Modify rule attributes.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RuleUpdateRequest'
      responses:
        '200':
          description: Rule updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteRule
      summary: Delete a rule
      description: Remove a rule. Returns HTTP 204 on success.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '204':
          description: Rule deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /rules/{ruleId}/libraries:
    get:
      operationId: listLibrariesForRule
      summary: List libraries for a rule
      description: Retrieve libraries that use the specified rule.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: A list of libraries.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LibraryListResponse'

  /rules/{ruleId}/revisions:
    get:
      operationId: listRevisionsForRule
      summary: List revisions for a rule
      description: Retrieve the revision history for a rule.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: A list of rule revisions.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleListResponse'

  /rules/{ruleId}/origin:
    get:
      operationId: getOriginForRule
      summary: Get the origin for a rule
      description: Retrieve the previous revision of a rule.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Origin rule details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleSingleResponse'

  /rules/{ruleId}/property:
    get:
      operationId: getPropertyForRule
      summary: Get the property for a rule
      description: Retrieve the property that owns the specified rule.
      tags:
        - Rules
      parameters:
        - $ref: '#/components/parameters/ruleId'
      responses:
        '200':
          description: Property details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertySingleResponse'

  # Rule Components
  /properties/{propertyId}/rule_components:
    post:
      operationId: createRuleComponent
      summary: Create a rule component
      description: Create a new rule component (event, condition, or action) under the specified property.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RuleComponentCreateRequest'
      responses:
        '201':
          description: Rule component created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleComponentSingleResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /rules/{ruleId}/rule_components:
    get:
      operationId: listRuleComponentsForRule
      summary: List rule components for a rule
      description: Retrieve all components belonging to a rule.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/ruleId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterEnabled'
        - $ref: '#/components/parameters/filterPublished'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of rule components.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleComponentListResponse'

  /rule_components/{ruleComponentId}:
    get:
      operationId: getRuleComponent
      summary: Retrieve a rule component
      description: Look up a specific rule component by its ID.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/ruleComponentId'
      responses:
        '200':
          description: Rule component details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleComponentSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRuleComponent
      summary: Update a rule component
      description: Modify a rule component's attributes.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/ruleComponentId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/RuleComponentUpdateRequest'
      responses:
        '200':
          description: Rule component updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RuleComponentSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteRuleComponent
      summary: Delete a rule component
      description: Remove a rule component. Returns HTTP 204 on success.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/ruleComponentId'
      responses:
        '204':
          description: Rule component deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /rule_components/{ruleComponentId}/extension:
    get:
      operationId: getExtensionForRuleComponent
      summary: Get the extension for a rule component
      description: Retrieve the extension that provides the specified rule component.
      tags:
        - Rule Components
      parameters:
        - $ref: '#/components/parameters/ruleComponentId'
      responses:
        '200':
          description: Extension details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionSingleResponse'

  # Data Elements
  /properties/{propertyId}/data_elements:
    get:
      operationId: listDataElementsForProperty
      summary: List data elements for a property
      description: Retrieve all data elements belonging to a property.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/propertyId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterEnabled'
        - $ref: '#/components/parameters/filterPublished'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of data elements.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataElementListResponse'
    post:
      operationId: createDataElement
      summary: Create a data element
      description: Create a new data element under the specified property.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/DataElementCreateRequest'
      responses:
        '201':
          description: Data element created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataElementSingleResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /data_elements/{dataElementId}:
    get:
      operationId: getDataElement
      summary: Retrieve a data element
      description: Look up a specific data element by its ID.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      responses:
        '200':
          description: Data element details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataElementSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDataElement
      summary: Update a data element
      description: Modify a data element's attributes.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/DataElementUpdateRequest'
      responses:
        '200':
          description: Data element updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataElementSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteDataElement
      summary: Delete a data element
      description: Remove a data element. Returns HTTP 204 on success.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      responses:
        '204':
          description: Data element deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /data_elements/{dataElementId}/revisions:
    get:
      operationId: listRevisionsForDataElement
      summary: List revisions for a data element
      description: Retrieve the revision history for a data element.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      responses:
        '200':
          description: A list of data element revisions.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DataElementListResponse'

  /data_elements/{dataElementId}/extension:
    get:
      operationId: getExtensionForDataElement
      summary: Get the extension for a data element
      description: Retrieve the extension associated with the specified data element.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      responses:
        '200':
          description: Extension details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionSingleResponse'

  /data_elements/{dataElementId}/property:
    get:
      operationId: getPropertyForDataElement
      summary: Get the property for a data element
      description: Retrieve the property that owns the specified data element.
      tags:
        - Data Elements
      parameters:
        - $ref: '#/components/parameters/dataElementId'
      responses:
        '200':
          description: Property details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/PropertySingleResponse'

  # Extensions
  /properties/{propertyId}/extensions:
    get:
      operationId: listExtensionsForProperty
      summary: List extensions for a property
      description: Retrieve all extensions installed in a property.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/propertyId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterEnabled'
        - $ref: '#/components/parameters/filterPublished'
        - $ref: '#/components/parameters/filterDirty'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of extensions.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionListResponse'
    post:
      operationId: createExtension
      summary: Install an extension
      description: Install a new extension in the specified property.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ExtensionCreateRequest'
      responses:
        '201':
          description: Extension installed successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionSingleResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /extensions/{extensionId}:
    get:
      operationId: getExtension
      summary: Retrieve an extension
      description: Look up a specific extension by its ID.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/extensionId'
      responses:
        '200':
          description: Extension details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateExtension
      summary: Revise an extension
      description: Update or revise an extension's attributes.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/extensionId'
      requestBody:
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/ExtensionUpdateRequest'
      responses:
        '200':
          description: Extension updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteExtension
      summary: Delete an extension
      description: Remove an extension. Returns HTTP 204 on success.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/extensionId'
      responses:
        '204':
          description: Extension deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'

  /extensions/{extensionId}/extension_package:
    get:
      operationId: getExtensionPackageForExtension
      summary: Get the extension package for an extension
      description: Retrieve the extension package associated with the specified extension.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/extensionId'
      responses:
        '200':
          description: Extension package details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageSingleResponse'

  /extensions/{extensionId}/revisions:
    get:
      operationId: listRevisionsForExtension
      summary: List revisions for an extension
      description: Retrieve the revision history for an extension.
      tags:
        - Extensions
      parameters:
        - $ref: '#/components/parameters/extensionId'
      responses:
        '200':
          description: A list of extension revisions.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionListResponse'

  # Extension Packages
  /extension_packages:
    get:
      operationId: listExtensionPackages
      summary: List extension packages
      description: Retrieve all extension packages available to you.
      tags:
        - Extension Packages
      parameters:
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of extension packages.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageListResponse'
    post:
      operationId: createExtensionPackage
      summary: Create an extension package
      description: Upload a new extension package via multipart form data.
      tags:
        - Extension Packages
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
                  description: The extension package ZIP file.
      responses:
        '201':
          description: Extension package created successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageSingleResponse'

  /extension_packages/{extensionPackageId}:
    get:
      operationId: getExtensionPackage
      summary: Retrieve an extension package
      description: Look up a specific extension package by its ID.
      tags:
        - Extension Packages
      parameters:
        - $ref: '#/components/parameters/extensionPackageId'
      responses:
        '200':
          description: Extension package details.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateExtensionPackage
      summary: Update an extension package
      description: >-
        Update an extension package. Also used to release privately or
        discontinue a package by setting the appropriate meta action.
      tags:
        - Extension Packages
      parameters:
        - $ref: '#/components/parameters/extensionPackageId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  format: binary
                  description: The updated extension package ZIP file.
      responses:
        '200':
          description: Extension package updated successfully.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /extension_packages/{extensionPackageId}/versions:
    get:
      operationId: listVersionsForExtensionPackage
      summary: List versions for an extension package
      description: Retrieve all previous versions of an extension package.
      tags:
        - Extension Packages
      parameters:
        - $ref: '#/components/parameters/extensionPackageId'
      responses:
        '200':
          description: A list of extension package versions.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ExtensionPackageListResponse'

  # Libraries
  /properties/{propertyId}/libraries:
    get:
      operationId: listLibrariesForProperty
      summary: List libraries for a property
      description: Retrieve a list of libraries belonging to a property.
      tags:
        - Libraries
      parameters:
        - $ref: '#/components/parameters/propertyId'
        - $ref: '#/components/parameters/filterCreatedAt'
        - $ref: '#/components/parameters/filterName'
        - $ref: '#/components/parameters/filterUpdatedAt'
        - $ref: '#/components/parameters/pageNumber'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
