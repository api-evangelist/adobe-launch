public_pricing_note: >-
  Adobe publishes no price, no plan table and no self-serve signup for Adobe
  Launch / Experience Platform Tags. It is not sold on its own: entitlement
  arrives bundled with an Adobe Experience Cloud product license and the
  commercial terms live in the customer contract and the Product Description.
  There is nothing to reconcile against a pricing page because there is no
  pricing page — recorded as plan_count 1 (a single bundled entitlement) rather
  than omitted.
tags:
  - Tag Management
  - Web Analytics
  - Mobile Analytics
  - Experience Platform
notes: >-
  Adobe Launch was renamed Adobe Experience Platform Tags (and Tags for
  Mobile / Edge); it is included at no additional charge with any Adobe
  Experience Cloud product license (Analytics, Target, AEP, etc.). It is
  not separately metered or sold. The Reactor API is the public REST
  interface for tag deployment. There is no separate price to reconcile.
description: >-
  Adobe Launch / Experience Platform Tags is a tag-management service
  bundled with Experience Cloud product licenses. The Reactor API
  manages properties, rules, data elements, and library publishing. No
  separate subscription is required.
sources:
  - https://experienceleague.adobe.com/docs/experience-platform/tags/home.html
  - https://developer.adobe.com/experience-platform-apis/references/reactor/
plans:
  - id: adobe-launch-included
    name: Tags (Included with Experience Cloud)
    type: enterprise
    description: >-
      Tag management is bundled with any Adobe Experience Cloud product
      license; there is no separate fee. Reactor API access is granted to
      any IMS user with admin entitlement.
    entries:
