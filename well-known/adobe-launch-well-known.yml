notes: >-
  Only one real .well-known document is served anywhere across the Adobe Launch
  surface: the corporate security.txt at www.adobe.com, which is PGP-signed and
  points at Adobe PSIRT and the HackerOne program. Every path under
  https://developer.adobe.com/.well-known/ returns HTTP 200 with the
  developer-portal SPA shell (text/html, `<!DOCTYPE html>`) rather than a
  document — that is a catch-all route, NOT a served surface, and it is
  recorded here as a miss so it cannot be mistaken for a hit. The API hosts
  themselves (reactor.adobe.io, edge.adobedc.net, server.adobedc.net) return
  a clean 404 on every .well-known path.
