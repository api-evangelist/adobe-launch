specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Adobe Launch
providerId: adobe-launch
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Tag Management
  - Experience Platform
notes: >-
  The Reactor API enforces per-IMS-organization throttling but does not
  publish numeric per-second / per-minute ceilings. Tag-delivery traffic
  (the actual visitor-side library load) is served from the Adobe Edge
  CDN and is not gated by Reactor throttling.
description: >-
  Adobe Launch / Experience Platform Tags has two distinct surfaces:
  the Reactor API (administrative; CRUD on properties, rules, builds) and
  the tag-delivery CDN (visitor-side library fetch). Reactor enforces
  per-IMS-organization throttling; CDN delivery has no per-customer rate
  limit beyond standard CDN protections.
sources:
  - https://developer.adobe.com/experience-platform-apis/references/reactor/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Reactor API
    scope: ims-org
    metric: requests_per_minute
    limit: see https://developer.adobe.com/experience-platform-apis/references/reactor/
    notes: >-
      Per-organisation throttle on administrative operations (create
      property, add rule, publish library, etc.).
  - name: Tag-delivery CDN
    scope: edge
    metric: requests_per_second
    limit: see Adobe Edge CDN protection
    notes: >-
      CDN-served library fetch with standard edge protections; not
      separately metered.
policies:
  - name: Backoff Strategy
    description: Exponential backoff with jitter; honor Retry-After when present.
  - name: Build pipeline pacing
    description: >-
      Library publish operations are async; poll the build endpoint
      rather than retrying create-build calls.
  - name: IMS-org scope
    description: >-
      Reactor throttling aggregates across all credentials issued under a
      single Adobe IMS organization.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
